name: continuous-sync

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel upload workers
        required: false
        default: '6'
      limit:
        description: Maximum verified episodes per run
        required: false
        default: '50'
      runtime_minutes:
        description: How long to keep polling the verified source queue
        required: false
        default: '330'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: sdilej-serialy-target-transfer
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CONTINUOUS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Configure durable upload checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Upload verified episode queue with leased workers
        env:
          CONTINUOUS_ENABLED: ${{ vars.CONTINUOUS_ENABLED }}
          UPLOAD_WORKERS: ${{ inputs.workers || '6' }}
          SYNC_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '330' }}
          SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
          SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
          PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
          PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SYNC_RUNTIME_MINUTES" =~ ^[0-9]+$ ]]
          (( SYNC_RUNTIME_MINUTES >= 1 && SYNC_RUNTIME_MINUTES <= 330 ))
          sync_deadline_epoch=$(( $(date +%s) + SYNC_RUNTIME_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$sync_deadline_epoch" ]; do
            git pull --rebase origin main
            sync_output=$(sdilej-series continuous \
              --persist-git-state \
              --workers '${{ inputs.workers || '6' }}' \
              --limit '${{ inputs.limit || '50' }}' 2>&1 | tee /dev/stderr)
            if grep -q '"queued": 0' <<<"$sync_output"; then
              sleep 120
            else
              sleep 5
            fi
          done
      - name: Persist confirmed uploads and runtime report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: checkpoint series uploads'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
