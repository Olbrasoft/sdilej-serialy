name: pilot-plan

on:
  workflow_dispatch:
    inputs:
      series_limit:
        description: Number of top-rated series to export
        required: true
        default: '1'
      episode_limit:
        description: Maximum episode rows to export
        required: true
        default: '1'
      series_id:
        description: Optional CR series ID for a known pilot series
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sdilej-serialy-source-preparation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[whisper]"
      - name: Open an encrypted read-only database tunnel
        env:
          CR_VPS_SSH_KEY: ${{ secrets.CR_VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CR_VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 46.225.101.253 >> ~/.ssh/known_hosts
          ssh -f -N -L 127.0.0.1:15432:127.0.0.1:5432 -p 2222 root@46.225.101.253
      - name: Export catalog through a read-only database transaction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERIES_ID: ${{ inputs.series_id }}
        run: |
          args=(--series-limit '${{ inputs.series_limit }}' --episode-limit '${{ inputs.episode_limit }}')
          [ -z "$SERIES_ID" ] || args+=(--series-id "$SERIES_ID")
          sdilej-series export-catalog "${args[@]}"
      - name: Find and verify Sdilej.cz sources
        env:
          SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
          SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
        run: sdilej-series prepare --limit '${{ inputs.episode_limit }}'
      - name: Commit reviewed plan state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A backlog plans state
          git diff --cached --quiet || git commit -m 'chore: prepare series pilot plan'
          git push
