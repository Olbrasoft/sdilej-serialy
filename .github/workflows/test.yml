name: test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'reports/**'
      - 'recovery/**'
      - 'dual/**'
      - 'manifests/**'
      - 'backlog/**'
      - 'audit/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[test]"
      - run: pytest
